<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Perkasa Motors · Financial Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ═══════════ PERKASA FINANCIAL COMMAND CENTER — premium / minimal ═══════════ */
:root{
  --bg:#0b0f17; --bg2:#111725; --panel:#151c2c; --panel2:#1a2233;
  --line:#243049; --line2:#2e3c5a;
  --ink:#eef2fb; --ink2:#aeb8ce; --ink3:#78859e;
  --accent:#4f8cff; --accent2:#7aa8ff; --good:#2fbf83; --warn:#f5a623; --bad:#f4595c;
  --gold:#d9b45a; --chip:#1c2437; --shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--accent2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#26324c;border-radius:9px}

/* ── Login ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 70% -10%,#16233f 0%,var(--bg) 60%)}
.login-card{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#2f6fe0);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px}
.brand b{font-size:16px;letter-spacing:-.02em}
.login-sub{color:var(--ink3);font-size:12.5px;margin:2px 0 22px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:6px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.fld input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);font-size:14.5px;outline:none;transition:.15s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.14)}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),#2f6fe0);color:#fff;border:0;border-radius:10px;padding:12.5px;font-weight:700;font-size:14.5px;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6}
.err{display:none;background:rgba(244,89,92,.12);border:1px solid rgba(244,89,92,.35);color:#ffb4b6;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:13px}

/* ── App shell ── */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.side{width:240px;flex:0 0 240px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.side .brand{padding:18px 18px 14px}
.nav{padding:6px 10px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:13.5px;margin-bottom:1px;cursor:pointer}
.nav a .ic{width:18px;text-align:center;opacity:.85}
.nav a:hover{background:var(--panel);color:var(--ink)}
.nav a.on{background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(79,140,255,.05));color:#fff;border:1px solid rgba(79,140,255,.3)}
.side .foot{padding:12px 14px;border-top:1px solid var(--line)}
.userchip{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2)}
.userchip .av{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);border:1px solid var(--line)}
.logout{background:none;border:1px solid var(--line);color:var(--ink3);border-radius:8px;padding:6px 10px;font-size:11.5px;margin-left:auto}
.logout:hover{color:var(--ink);border-color:var(--line2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px}
.top h1{font-size:17px}
.top .sub{color:var(--ink3);font-size:12px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(47,191,131,.18)}
.wrap{padding:22px 26px 60px;max-width:1220px;width:100%}
.hamb{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:34px;font-size:16px}

/* ── Cards / grid ── */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.card.pad{padding:18px 19px}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:9px}
.kpi .val.sm{font-size:20px}
.kpi .meta{font-size:12px;color:var(--ink2);margin-top:6px}
.kpi .tag{position:absolute;top:14px;right:15px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.t-good{background:rgba(47,191,131,.14);color:#5fe0a8}
.t-warn{background:rgba(245,166,35,.14);color:#f6c366}
.t-bad{background:rgba(244,89,92,.14);color:#ff9b9d}
.t-info{background:rgba(79,140,255,.14);color:#9cbcff}

.sec-h{display:flex;align-items:center;gap:10px;margin:26px 2px 12px}
.sec-h h2{font-size:15px}
.sec-h .hint{font-size:12px;color:var(--ink3)}
.sec-h:first-child{margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:700;background:var(--bg2);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.p-legacy{background:rgba(122,135,163,.18);color:#c0c9de}
.p-current{background:rgba(79,140,255,.16);color:#9cbcff}
.p-sold{background:rgba(47,191,131,.14);color:#5fe0a8}
.p-active{background:rgba(245,166,35,.14);color:#f6c366}
.muted{color:var(--ink3)}
.pos{color:#5fe0a8}.neg{color:#ff9b9d}

/* open items banner */
.banner{background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(245,166,35,.03));border:1px solid rgba(245,166,35,.32);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.banner h3{font-size:13px;color:#f6c366;display:flex;align-items:center;gap:8px}
.banner ul{margin:9px 0 0;padding-left:18px;color:var(--ink2);font-size:12.5px}
.banner li{margin-bottom:4px}

/* funding simulator */
.sim-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.sim-row .fld{margin:0;flex:1;min-width:200px}
.sim-row .fld input{font-family:'JetBrains Mono',monospace;font-size:16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{background:var(--chip);border:1px solid var(--line);color:var(--ink2);border-radius:20px;padding:5px 11px;font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.bar{height:9px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}

.note{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.5}
.lgnd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:13px}
.deny{padding:60px 20px;text-align:center;color:var(--ink3)}
.deny .lock{font-size:40px;margin-bottom:12px}

.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--ink2);padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--panel2);color:var(--ink)}

/* responsive */
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .hamb{display:block}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .backdrop.on{display:block}
  .wrap{padding:16px 14px 60px}
  .top{padding:12px 14px}
}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}
</style>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login">
  <div class="login-card">
    <div class="brand"><div class="logo">P</div><div><b>Perkasa Motors</b><div class="login-sub">Financial Command Center</div></div></div>
    <div class="err" id="loginErr"></div>
    <div class="fld"><label>Username</label><input id="u" autocomplete="username" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="fld"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn" id="loginBtn" onclick="login()">Masuk</button>
    <div class="note" style="text-align:center;margin-top:16px">Sistem keuangan · sumber data tervalidasi Supabase</div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="backdrop" id="backdrop" onclick="toggleNav(false)"></div>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand"><div class="logo">P</div><div><b>Perkasa Motors</b><div class="login-sub">Command Center</div></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="foot">
        <div class="userchip"><div class="av" id="av">P</div><div><div id="uName" style="color:var(--ink);font-weight:600">—</div><div id="uRole" style="font-size:11px" class="muted">—</div></div>
          <button class="logout" onclick="logout()">Keluar</button></div>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <button class="hamb" onclick="toggleNav(true)">☰</button>
        <div><h1 id="secTitle">Command Center</h1><div class="sub" id="secSub">Ringkasan keuangan real-time</div></div>
        <div class="right"><span class="dot" id="syncDot"></span><span class="sub" id="syncTxt">Terhubung</span></div>
      </div>
      <div class="wrap" id="view"><div class="empty"><span class="spin"></span> Memuat…</div></div>
    </main>
  </div>
</div>

<script>
/* ═══════════ Supabase (anon key reused from production app) ═══════════ */
const SUPABASE_URL='https://pefkfuoowzfnbkmygzxo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZmtmdW9vd3pmbmJrbXlnenhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTA2MjIsImV4cCI6MjA5Njk2NjYyMn0.vMlXRGlYEe2r5N7UlO7MKqJZ_l2a8hwiO1nN_G3zf04';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentUser=null, currentRole=null, roleClass='viewer';

/* ── role helpers (mirrors production RBAC) ── */
function roleOf(role){const r=(role||'').toLowerCase();
  if(r==='panji'||r==='pandu'||r==='partner')return 'partner';
  if(r==='admin')return 'admin'; if(r==='super_admin'||r==='superadmin')return 'super_admin';
  if(r==='investor')return 'investor'; return 'viewer';}
const CFO_ROLES=['partner','admin','super_admin'];           // full financial view
const canSeeProfit=()=>CFO_ROLES.includes(roleClass);
const isInvestor=()=>roleClass==='investor';

/* ── formatting ── */
const fmt=n=>{n=Number(n||0);const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(a>=1e10?1:2)+' M';
  if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:1)+' jt';
  if(a>=1e3)return Math.round(n/1e3)+' rb'; return String(Math.round(n));};
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const rpS=n=>'Rp'+fmt(n);
const pct=n=>(n==null?'—':Number(n).toFixed(n%1?1:0)+'%');
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ═══════════ AUTH ═══════════ */
async function login(){
  const u=document.getElementById('u').value.trim().toLowerCase();
  const p=document.getElementById('p').value;
  const err=document.getElementById('loginErr'), btn=document.getElementById('loginBtn');
  err.style.display='none'; btn.disabled=true; btn.textContent='Memeriksa…';
  try{
    const {data,error}=await db.rpc('pm_login',{p_user:u,p_pass:p});
    if(error)throw error;
    if(data&&data.ok){ startSession((data.username||u).toLowerCase(),data.role); }
    else{ err.textContent=(data&&data.error)||'Username atau password salah.'; err.style.display='block'; }
  }catch(e){ err.textContent='Gagal terhubung ke server. Cek koneksi.'; err.style.display='block'; }
  btn.disabled=false; btn.textContent='Masuk';
}
function startSession(u,role){
  currentUser=u; currentRole=role; roleClass=roleOf(role);
  sessionStorage.setItem('pm_cfo',JSON.stringify({u,role}));
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('uName').textContent=u.charAt(0).toUpperCase()+u.slice(1);
  document.getElementById('uRole').textContent=roleClass.replace('_',' ');
  document.getElementById('av').textContent=u.charAt(0).toUpperCase();
  buildNav(); go(NAV.find(n=>allowed(n))?.id||'command');
}
function logout(){ sessionStorage.removeItem('pm_cfo'); location.reload(); }
window.addEventListener('DOMContentLoaded',()=>{
  const s=sessionStorage.getItem('pm_cfo');
  if(s){try{const o=JSON.parse(s);startSession(o.u,o.role);}catch(e){}}
});

/* ═══════════ NAV / ROUTING ═══════════ */
const NAV=[
  {grp:'Ringkasan'},
  {id:'command',  ic:'◆', t:'Command Center', sub:'Ringkasan keuangan real-time', roles:'all'},
  {grp:'Operasi Keuangan'},
  {id:'cash',     ic:'▤', t:'Cash & Reserve', sub:'Kas & cadangan 10%', roles:'cfo'},
  {id:'inventory',ic:'▦', t:'Inventory',      sub:'Stok pada biaya ekonomis', roles:'cfo'},
  {id:'capital',  ic:'◈', t:'Capital',        sub:'Rekonsiliasi modal', roles:'cfo'},
  {grp:'Investor & Pendanaan'},
  {id:'investors',ic:'◉', t:'Investors',      sub:'Portofolio & siklus modal', roles:'all'},
  {id:'funding',  ic:'⟳', t:'Funding',        sub:'Kapasitas & simulator', roles:'cfo'},
  {grp:'Laporan'},
  {id:'pnl',      ic:'▥', t:'P&L',            sub:'Laba rugi (dua tingkat)', roles:'cfo'},
  {id:'cashflow', ic:'≋', t:'Cash Flow',      sub:'Arus kas', roles:'cfo'},
  {id:'reports',  ic:'▣', t:'Reports',        sub:'Rekonsiliasi & ekspor', roles:'cfo'},
  {grp:'Sistem'},
  {id:'settings', ic:'⚙', t:'Settings',       sub:'Kebijakan & asumsi', roles:'cfo'},
];
function allowed(n){ if(!n.id)return true; if(n.roles==='all')return true; if(n.roles==='cfo')return canSeeProfit(); return true; }
function buildNav(){
  const el=document.getElementById('nav'); el.innerHTML='';
  NAV.forEach(n=>{
    if(n.grp){ const g=document.createElement('div'); g.className='grp'; g.textContent=n.grp; el.appendChild(g); return; }
    if(!allowed(n))return;
    const a=document.createElement('a'); a.dataset.id=n.id;
    a.innerHTML=`<span class="ic">${n.ic}</span>${n.t}`; a.onclick=()=>go(n.id); el.appendChild(a);
  });
}
function toggleNav(open){document.getElementById('side').classList.toggle('open',open);document.getElementById('backdrop').classList.toggle('on',open);}
let cur=null;
function go(id){
  const n=NAV.find(x=>x.id===id); if(!n||!allowed(n))return;
  cur=id; toggleNav(false);
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  document.getElementById('secTitle').textContent=n.t;
  document.getElementById('secSub').textContent=n.sub;
  document.getElementById('view').innerHTML='<div class="empty"><span class="spin"></span> Memuat…</div>';
  (RENDER[id]||(()=>{}))();
}
function setSync(ok){document.getElementById('syncDot').style.background=ok?'var(--good)':'var(--bad)';
  document.getElementById('syncTxt').textContent=ok?'Terhubung':'Terputus';}

/* ═══════════ DATA ═══════════ */
async function q(sel){ // read a view/table
  try{ const {data,error}=await db.from(sel).select('*'); if(error)throw error; setSync(true); return data||[]; }
  catch(e){ setSync(false); console.warn('read',sel,e.message); return null; }
}
async function q1(sel){ const r=await q(sel); return r&&r.length?r[0]:null; }
function view(html){ document.getElementById('view').innerHTML=html; }
function dbErr(v){ return `<div class="card"><div class="empty">⚠ View <b>${v}</b> belum tersedia.<br><span class="muted">Jalankan file SQL Phase terkait di Supabase SQL Editor, lalu muat ulang.</span></div></div>`; }

/* ── reusable bits ── */
function kpi(lab,val,meta,tag,tagCls){return `<div class="card kpi">${tag?`<span class="tag ${tagCls||'t-info'}">${tag}</span>`:''}<div class="lab">${lab}</div><div class="val">${val}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;}
function openItems(c){
  const items=[];
  if(c&&Number(c.unresolved_variance)!==0) items.push(`Selisih settlement Unit belum terselesaikan: <b>${rp(c.unresolved_variance)}</b> (Unit #37 — dipertahankan sesuai keputusan founder).`);
  if(c&&Number(c.unmapped_accounts)>0) items.push(`<b>${c.unmapped_accounts}</b> akun modal belum dipetakan ke login (mis. akun "Modal" — identitas belum dikonfirmasi).`);
  if(c&&(c.opening_cash_verified==='false'||c.opening_cash_verified===false||c.opening_cash_verified==null)) items.push(`Saldo kas awal <b>${rp(c?c.opening_cash:0)}</b> masih <b>belum terverifikasi / sementara</b>.`);
  items.push(`Bagi hasil manajemen/sourcing founder = <b>0%</b> (placeholder yang dapat dikonfigurasi — <b>bukan</b> term komersial final).`);
  return `<div class="banner"><h3>⚠ Item Terbuka (perlu keputusan founder)</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
}
function deny(){return `<div class="deny"><div class="lock">🔒</div>Bagian ini dibatasi untuk peran Founder/CFO.<br><span class="muted">Peran Anda: ${roleClass}</span></div>`;}

/* ═══════════ RENDERERS ═══════════ */
const RENDER={};

/* ── COMMAND CENTER ── */
RENDER.command=async()=>{
  const c=await q1('v_command_center');
  if(!c)return view(dbErr('v_command_center'));
  const cfo=canSeeProfit();
  const reserveTgt=Number(c.reserve_target||0), resBal=Number(c.reserve_balance||0);
  const resPct=reserveTgt?Math.min(100,Math.round(resBal/reserveTgt*100)):0;
  let html=openItems(c);
  if(cfo){
    html+=`<div class="grid g4">
      ${kpi('Laba Terealisasi',rpS(c.realized_profit),`Laba operasi bersih ${rpS(c.net_operating_profit)}`,'Realized','t-good')}
      ${kpi('Pendapatan',rpS(c.revenue),`Margin kotor ${pct(c.gross_margin_pct)}`,null)}
      ${kpi('Saldo Cadangan',rpS(resBal),`Target ${rpS(reserveTgt)} · ${resPct}%`,pct(c.reserve_rate*100)+' rate','t-info')}
      ${kpi('Kas Tersedia (Cadangan)',rpS(c.available_reserve),`Dipakai ${rpS(c.deployed_reserve)}`,null)}
    </div>
    <div class="grid g4" style="margin-top:14px">
      ${kpi('Modal Terkumpul',rpS(c.capital_funded),`Aktif ${rpS(c.capital_deployed)} · Tersedia ${rpS(c.capital_available)}`,null)}
      ${kpi('Inventory (biaya)',rpS(c.inventory_at_cost),`${c.active_units} unit aktif`,null)}
      ${kpi('Unit Terjual',c.units_sold,`Rata² tahan ${c.mean_holding} hr · median ${c.median_holding} hr`,null)}
      ${kpi('Throughput',Number(c.throughput_mo).toFixed(1)+'/bln','Kapasitas operasional',null)}
    </div>`;
  }else{
    // investor / viewer — capital + own exposure only, no business profit
    html+=`<div class="grid g3">
      ${kpi('Modal Terkumpul',rpS(c.capital_funded),`Aktif ${rpS(c.capital_deployed)}`,null)}
      ${kpi('Eksposur Investor',rpS(c.investor_exposure),`${c.active_investors} investor aktif`,null)}
      ${kpi('Unit Terjual',c.units_sold,`Rata² tahan ${c.mean_holding} hr`,null)}
    </div>`;
  }
  html+=`<div class="sec-h"><h2>Cadangan menuju target</h2><span class="hint">${rpS(resBal)} / ${rpS(reserveTgt)}</span></div>
    <div class="card"><div class="bar"><i style="width:${resPct}%"></i></div>
      <div class="note">Cadangan adalah bagian kas yang di-ring-fence (kepemilikan perusahaan) — bukan modal atau laba investor.</div></div>`;
  view(html);
};

/* ── CASH & RESERVE ── */
RENDER.cash=async()=>{

  const led=await q('reserve_ledger');

    ${kpi('Saldo Cadangan',rpS(s.reserve_balance),'Retensi 10% dari laba',null)}
    ${kpi('Dipakai (Advance)',rpS(s.deployed_reserve),'Reserve advance outstanding',null)}
    ${kpi('Tersedia',rpS(s.available_reserve),'Saldo − advance',null,'t-good')}

/* ── CAPITAL ── */
RENDER.capital=async()=>{
  if(!canSeeProfit())return view(deny());

  const acc=await q('v_investor_summary');
  let html='';
  if(rec){
    const keys=Object.keys(rec);
    html+=`<div class="sec-h"><h2>Rekonsiliasi Modal</h2><span class="hint">semua harus cocok / nol</span></div>
      <div class="grid g4">${keys.slice(0,8).map(k=>kpi(k.replace(/_/g,' '),
        (/mismatch|break|diff/.test(k)&&Number(rec[k])!==0)?`<span class="neg">${fmt(rec[k])}</span>`:(/pct/.test(k)?pct(rec[k]):rpS(rec[k])),
        null, (/mismatch|break|diff/.test(k))?(Number(rec[k])===0?'OK':'CEK'):null,
        (/mismatch|break|diff/.test(k))?(Number(rec[k])===0?'t-good':'t-bad'):'t-info')).join('')}</div>`;
  }else html+=dbErr('v_capital_reconcile');
  html+=`<div class="sec-h"><h2>Akun Modal</h2><span class="hint">Funded = Deployed + Available</span></div>`;

  else{
    const rows=acc.map(a=>`<tr><td>${esc(a.name)}</td>
      <td><span class="pill ${a.role==='founder'?'p-current':'p-legacy'}">${esc(a.role)}</span></td>
      <td class="muted">${a.account_username?esc(a.account_username):'<i>belum dipetakan</i>'}</td>
      <td class="num">${rp(a.funded)}</td><td class="num">${rp(a.deployed)}</td><td class="num">${rp(a.available)}</td>
      <td class="num">${rp(a.capital_returned)}</td></tr>`).join('');

  }
  view(html);
};

/* ── INVESTORS ── */
RENDER.investors=async()=>{
  const mapped=await q('v_investor_summary_mapped');
  if(!mapped)return view(dbErr('v_investor_summary_mapped'));
  const cfo=canSeeProfit();
  // investor sees only their own row
  let rows=mapped;
  if(isInvestor()) rows=mapped.filter(m=>String(m.investor_key||'').toLowerCase()===currentUser);
  let html='';
  const totFund=rows.reduce((a,r)=>a+Number(r.funded||0),0);
  const totDep=rows.reduce((a,r)=>a+Number(r.deployed||0),0);
  const totRet=rows.reduce((a,r)=>a+Number(r.realized_profit||0),0);
  html+=`<div class="grid g3">
    ${kpi(isInvestor()?'Modal Anda':'Total Modal Investor',rpS(totFund),`Aktif ${rpS(totDep)}`,null)}
    ${kpi('Modal Aktif',rpS(totDep),'Sedang dikerahkan',null)}
    ${cfo||isInvestor()?kpi('Laba Terealisasi',rpS(totRet),'Pada modal yang telah berputar',null,'t-good'):kpi('Investor Aktif',rows.length,'Dengan eksposur',null)}
  </div>`;
  html+=`<div class="sec-h"><h2>Portofolio Investor</h2><span class="hint">siklus modal · realized vs unrealized</span></div>`;
  if(!rows.length)html+=`<div class="card"><div class="empty">Tidak ada data untuk ditampilkan.</div></div>`;
  else{
    const rr=rows.map(m=>`<tr><td>${esc(m.investor_key)}${m.is_mapped?'':' <span class="pill p-active">unmapped</span>'}</td>
      <td class="num">${rp(m.funded)}</td><td class="num">${rp(m.deployed)}</td><td class="num">${rp(m.available)}</td>
      <td class="num">${rp(m.capital_returned)}</td>
      <td class="num pos">${rp(m.realized_profit)}</td>
      <td class="num muted">${rp(m.expected_profit_active)}</td>
      <td class="num">${pct(m.realized_roi_pct)}</td></tr>`).join('');
    html+=`<div class="tbl-wrap"><table><thead><tr><th>Investor</th><th class="num">Funded</th><th class="num">Deployed</th><th class="num">Available</th><th class="num">Returned</th><th class="num">Laba Realized</th><th class="num">Ekspektasi (aktif)</th><th class="num">ROI Realized</th></tr></thead><tbody>${rr}</tbody></table></div>
    <div class="note">Available = Funded − Deployed (modal kembali masuk lagi ke Available). Reserve bukan modal/ekuitas investor. Laba <b>realized</b> hanya pada modal yang telah menyelesaikan satu siklus; ekspektasi pada unit aktif ditampilkan terpisah.</div>`;
  }
  view(html);
};

/* ── FUNDING (+ simulator) ── */
RENDER.funding=async()=>{
  if(!canSeeProfit())return view(deny());
  const cap=await q1('v_funding_capacity');
  const util=await q1('v_funding_utilization');
  const rec=await q1('v_funding_recommendation');
  let html='';
  if(cap){
    html+=`<div class="grid g4">
      ${kpi('Kapasitas/bln',Number(cap.throughput_per_month||cap.capacity_units_per_month||0).toFixed(1)+' unit','Batas operasional',null)}
      ${util?kpi('Utilisasi',pct(util.utilization_pct),`Idle ${rpS(util.idle_capital||0)}`,null,Number(util.utilization_pct)>=80?'t-good':'t-warn'):''}
      ${cap.avg_cost_per_unit?kpi('Biaya/Unit',rpS(cap.avg_cost_per_unit),'Rata²',null):''}
      ${rec&&rec.recommended_funding?kpi('Rekomendasi Funding',rpS(rec.recommended_funding),esc(rec.rationale||''),null,'t-info'):''}
    </div>`;
  }
  // Simulator
  html+=`<div class="sec-h"><h2>Simulator Pendanaan</h2><span class="hint">masukkan jumlah apa pun</span></div>
   <div class="card pad">
     <div class="sim-row">
       <div class="fld"><label>Jumlah Pendanaan (Rp)</label><input id="simAmt" class="mono" value="100000000" inputmode="numeric" onkeydown="if(event.key==='Enter')runSim()"></div>
       <button class="btn" style="width:auto;padding:12px 22px" onclick="runSim()">Simulasikan</button>
     </div>
     <div class="chips">
       ${[50,100,200,300,500].map(m=>`<button class="chip" onclick="setSim(${m}000000)">${m} jt</button>`).join('')}
       <button class="chip" onclick="setSim(1000000000)">1 M</button>
     </div>
     <div id="simOut" style="margin-top:16px"></div>
     <div class="note" id="simNote"></div>
   </div>`;
  view(html);
};
function setSim(v){document.getElementById('simAmt').value=v;runSim();}
async function runSim(){
  const amt=Number(String(document.getElementById('simAmt').value).replace(/[^\d]/g,''))||0;
  const out=document.getElementById('simOut'); out.innerHTML='<span class="spin"></span> Menghitung…';
  try{
    const {data,error}=await db.rpc('pm_funding_sim',{p_funding:amt});
    if(error)throw error;
    if(!data||!data.ok){out.innerHTML=`<div class="empty">⚠ ${data&&data.error?esc(data.error):'Simulator belum tersedia — jalankan phase8_ui_support.sql.'}</div>`;return;}
    const d=data, u=Number(d.utilization_pct||0);
    out.innerHTML=`<div class="grid g4">
      ${kpi('Modal Dikerahkan',rpS(d.deployed),`Idle ${rpS(d.idle)}`,null)}
      ${kpi('Utilisasi',pct(d.utilization_pct),`Throughput ${Number(d.actual_throughput_mo).toFixed(1)}/bln`,null,u>=80?'t-good':'t-warn')}
      ${kpi('Laba Bisnis/thn',rpS(d.annual_business_profit),`Cadangan ${rpS(d.reserve_retention)}`,null)}
      ${kpi('Laba Dibagikan',rpS(d.distributable_profit),`Investor ${rpS(d.investor_realized_profit)}`,null,'t-good')}
    </div>
    <div class="grid g4" style="margin-top:14px">
      ${kpi('ROI Operasi / Deployed',pct(d.operating_roi_on_deployed_pct),'Laba bisnis ÷ modal dikerahkan',null,'t-info')}
      ${kpi('ROI Investor / Funded',pct(d.investor_roi_on_funded_pct),'Laba investor ÷ modal disetor',null)}
      ${kpi('ROI Investor / Deployed',pct(d.investor_roi_on_deployed_pct),'Laba investor ÷ modal dikerahkan',null)}
      ${kpi('Multiple / Funded',Number(d.investor_return_multiple_on_funded).toFixed(2)+'×','Kelipatan pengembalian',null)}
    </div>
    <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100,u)}%"></i></div>`;
    document.getElementById('simNote').innerHTML=`<b>${esc(d.scenario_label)}</b><br>
      Kapasitas operasional membatasi throughput pada ${Number(d.ops_ceiling_mo).toFixed(1)} unit/bln; modal yang melebihi kebutuhan itu menjadi <b>idle</b>.
      ROI <b>operasi pada modal dikerahkan</b> ≠ ROI <b>investor pada modal disetor</b> — keduanya ditampilkan terpisah dengan penyebut eksplisit.
      Bagi hasil manajemen founder = ${pct(d.founder_mgmt_share*100)} (dapat dikonfigurasi; bukan term final).`;
  }catch(e){out.innerHTML=`<div class="empty">⚠ ${esc(e.message||'gagal')}</div>`;}
}

/* ── P&L ── */
RENDER.pnl=async()=>{
  if(!canSeeProfit())return view(deny());

  if(!p)return view(dbErr('v_pnl'));
  const byC=await q('v_pnl_by_class');
  const line=(lab,val,strong,ind)=>`<tr><td style="${strong?'font-weight:700':''};padding-left:${(ind||0)*18+12}px">${lab}</td><td class="num" style="${strong?'font-weight:700':''}">${rp(val)}</td></tr>`;
  let html=`<div class="grid g3">
    ${kpi('Pendapatan',rpS(p.revenue),`${p.units_sold||''} unit`,null)}
    ${kpi('Laba Kotor',rpS(p.gross_profit),`Margin ${pct(p.gross_margin_pct)}`,null)}
    ${kpi('Laba Operasi Bersih',rpS(p.net_operating_profit),'Sebelum retensi cadangan',null,'t-good')}
  </div>
  <div class="sec-h"><h2>Laporan Laba Rugi (dua tingkat)</h2></div>
  <div class="tbl-wrap"><table><tbody>
    ${line('Pendapatan',p.revenue,true)}
    ${line('Harga Pokok (COGS)',-Math.abs(p.cogs),false,1)}
    ${line('Laba Kotor',p.gross_profit,true)}
    ${line('Biaya pendanaan unit / fee partner',-Math.abs(p.unit_financing_partner_fees||0),false,1)}
    ${line('Laba Unit Terealisasi',p.realized_unit_profit,true)}
    ${line('Biaya operasional perusahaan',-Math.abs(p.company_operating_expenses||0),false,1)}
    ${line('Laba Operasi Bersih',p.net_operating_profit,true)}
    ${line('Apropriasi retensi cadangan (10%)',-Math.abs(p.reserve_retention_appropriation||0),false,1)}
  </tbody></table></div>
  <div class="note">Retensi cadangan disajikan <b>di bawah</b> laba operasi bersih sebagai apropriasi — bukan biaya operasi.</div>`;
  if(byC&&byC.length){
    html+=`<div class="sec-h"><h2>Laba per Kelas Model</h2><span class="hint">legacy vs current</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Kelas</th><th class="num">Pendapatan</th><th class="num">COGS</th><th class="num">Laba Kotor</th><th class="num">Laba Unit</th><th class="num">Unit</th></tr></thead><tbody>
    ${byC.map(r=>`<tr><td><span class="pill ${r.model_class==='current'?'p-current':'p-legacy'}">${esc(r.model_class)}</span></td>
      <td class="num">${rp(r.revenue)}</td><td class="num">${rp(r.cogs)}</td><td class="num">${rp(r.gross_profit)}</td>
      <td class="num pos">${rp(r.realized_unit_profit)}</td><td class="num">${r.units}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  view(html);
};

/* ── CASH FLOW ── */
RENDER.cashflow=async()=>{
  if(!canSeeProfit())return view(deny());
  const cf=await q('v_cashflow');
  if(!cf)return view(dbErr('v_cashflow'));

/* ── REPORTS (reconciliation dashboards) ── */
RENDER.reports=async()=>{
  if(!canSeeProfit())return view(deny());
  const recs=[
    ['v_investor_recon','Rekonsiliasi Investor'],
    ['v_reserve_reconcile','Rekonsiliasi Cadangan'],
    ['v_capital_reconcile','Rekonsiliasi Modal'],
  ];
  let html=`<div class="note" style="margin-bottom:14px">Semua pemeriksaan bertanda <b>break/mismatch/diff</b> harus bernilai 0. Nilai lain adalah total kontrol.</div>`;
  for(const [v,title] of recs){
    const r=await q1(v);
    html+=`<div class="sec-h"><h2>${title}</h2><span class="hint mono">${v}</span></div>`;
    if(!r){html+=dbErr(v);continue;}
    const keys=Object.keys(r);
    html+=`<div class="grid g4">${keys.map(k=>{
      const isChk=/break|mismatch|diff|as_capital/.test(k); const bad=isChk&&Number(r[k])!==0;
      return kpi(k.replace(/_/g,' '),/pct/.test(k)?pct(r[k]):(typeof r[k]==='number'?rpS(r[k]):esc(r[k])),null,
        isChk?(bad?'CEK':'OK'):null, isChk?(bad?'t-bad':'t-good'):'t-info');
    }).join('')}</div>`;
  }
  view(html);
};

RENDER.settings=async()=>{

  if(pol){const a=pol.find(p=>p.status==='active')||pol[0];
    html+=`<div class="grid g3">
      ${kpi('Tarif Cadangan',a?pct(a.rate*100):'—','Kebijakan aktif',null,'t-info')}
      ${kpi('Berlaku Sejak',a?esc(a.effective_date):'—','Klasifikasi legacy/current',null)}
      ${kpi('Status',a?esc(a.status):'—','',null)}
    </div>`;}
  html+=`<div class="sec-h"><h2>Asumsi Pendanaan (dapat dikonfigurasi)</h2></div>`;
  if(asm){html+=`<div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th class="num">Nilai</th></tr></thead><tbody>
    ${asm.map(a=>`<tr><td>${esc(a.key)}</td><td class="num">${a.key.includes('share')?pct(a.value*100):(Number(a.value)>=1e5?rp(a.value):esc(a.value))}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="note">Bagi hasil manajemen founder (<b>founder_mgmt_share</b>) default 0% — placeholder yang dapat dikonfigurasi, bukan term komersial final.</div>`;}
  else html+=dbErr('funding_assumptions');
  if(cfg){const oc=cfg.find(c=>c.key==='opening_cash'),ocv=cfg.find(c=>c.key==='opening_cash_verified');
    html+=`<div class="sec-h"><h2>Konfigurasi Aplikasi</h2></div>

      ${kpi('Kas Awal',oc?rp(oc.value):'Rp0',(ocv&&String(ocv.value)==='true')?'Terverifikasi':'⚠ BELUM terverifikasi / sementara',null,(ocv&&String(ocv.value)==='true')?'t-good':'t-warn')}
    </div>`;}
  view(html);
};
